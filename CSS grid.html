<html>
    <head>
        <title>CSS grid</title>
        <style>
            .h1{
                text-align: center;
            }

            .parent{
                background-color: rgb(233, 155, 155);
                display: grid;
                grid-template-columns: 50% 20% 10% 10% 10%;  ;
                padding: 5px;
                gap: 10px;


            }
            .parent div{
                background-color: rgb(115, 47, 47);
                padding: 10px;
                gap: 10px;
               
            }
        </style>
    </head>
    <body>
     <h1>CSS grid</h1>
      <div class="parent"> 
       <div>1</div>
       <div>2</div>
       <div>3</div>
       <div>4</div>
       <div>5</div>
     </div>        
</html>
